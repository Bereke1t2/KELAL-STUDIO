# golangci-lint configuration (v2 schema). CI pins the golangci-lint version
# (see .github/workflows/backend-ci.yml), so this format is stable there.
version: "2"

run:
  timeout: 5m

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec      # security issues (PRD §7.8 takes this seriously)
    - misspell
    - revive     # golint successor: exported-symbol docs, naming, etc.
    - bodyclose  # HTTP response bodies must be closed (provider calls)
  exclusions:
    rules:
      # Test files legitimately do things gosec flags (weak rand, etc.).
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Bereke1t2/KELAL-STUDIO/backend
