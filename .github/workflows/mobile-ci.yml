name: mobile-ci

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  analyze:
    name: Format, analyze, vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Codegen (freezed/injectable/retrofit/drift/envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: dart format check
        run: dart format --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: osv-scanner (dependency vulnerabilities)
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=mobile/pubspec.lock

  test:
    name: Unit + widget tests, coverage
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests (excluding golden)
        run: flutter test --coverage --exclude-tags golden

      - name: Enforce coverage threshold on core/ and domain/ layers
        run: |
          # Placeholder threshold check — tune once the app has enough
          # surface area for a meaningful number. Fails loudly rather than
          # silently passing if lcov.info is missing.
          test -f coverage/lcov.info || (echo "::error::coverage/lcov.info missing" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile/coverage/lcov.info

  golden:
    name: Golden / screenshot tests (deterministic font mode)
    runs-on: ubuntu-latest
    needs: analyze
    env:
      # Alchemist's CI-deterministic mode — avoids cross-OS font-rendering
      # flakiness (see mobile/.claude/skills/flutter-testing/SKILL.md).
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Run golden tests
        run: flutter test --tags golden

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: mobile/test/goldens/failures/

  build-smoke:
    name: Debug build smoke test (Android)
    runs-on: ubuntu-latest
    needs: [test, golden]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (mock API, unobfuscated — smoke test only)
        run: flutter build apk --debug --dart-define=USE_MOCK_API=true
