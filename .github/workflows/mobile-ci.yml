name: mobile-ci

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  analyze:
    name: Format, analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Codegen (freezed/injectable/retrofit/drift/envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: dart format check
        run: dart format --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

  # Reusable workflow, not a step — google/osv-scanner-action ships as a
  # workflow_call target (google/osv-scanner-action/.github/workflows/
  # osv-scanner-reusable.yml), not a composite action. upload-sarif is off
  # since this repo doesn't have Code Scanning configured yet; fail-on-vuln
  # still fails the run on a real finding.
  osv-scan:
    name: Dependency vulnerability scan (osv-scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=mobile/pubspec.lock
      upload-sarif: false
      fail-on-vuln: true

  test:
    name: Unit + widget tests, coverage
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests (excluding golden)
        run: flutter test --coverage --exclude-tags golden

      - name: Enforce coverage threshold on core/ and domain/ layers
        run: |
          # Placeholder threshold check — tune once the app has enough
          # surface area for a meaningful number. Fails loudly rather than
          # silently passing if lcov.info is missing.
          test -f coverage/lcov.info || (echo "::error::coverage/lcov.info missing" && exit 1)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: mobile/coverage/lcov.info

  golden:
    name: Golden / screenshot tests (deterministic font mode)
    runs-on: ubuntu-latest
    needs: analyze
    env:
      # Alchemist's CI-deterministic mode — avoids cross-OS font-rendering
      # flakiness (see mobile/.claude/skills/flutter-testing/SKILL.md).
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Run golden tests
        run: flutter test --tags golden

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures
          path: mobile/test/goldens/failures/

  build-smoke:
    name: Debug build smoke test (Android)
    runs-on: ubuntu-latest
    needs: [test, golden]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (mock API, unobfuscated — smoke test only)
        run: flutter build apk --debug --dart-define=USE_MOCK_API=true
