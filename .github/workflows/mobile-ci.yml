name: mobile-ci

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  analyze:
    name: Format, analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Codegen (freezed/injectable/retrofit/drift/envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: dart format check
        run: dart format --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

  # Reusable workflow, not a step — google/osv-scanner-action ships as a
  # workflow_call target (google/osv-scanner-action/.github/workflows/
  # osv-scanner-reusable.yml), not a composite action. upload-sarif is off
  # since this repo doesn't have Code Scanning configured yet; fail-on-vuln
  # still fails the run on a real finding.
  osv-scan:
    name: Dependency vulnerability scan (osv-scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=mobile/pubspec.lock
      upload-sarif: false
      fail-on-vuln: true

  test:
    name: Unit + widget tests, coverage
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests (excluding golden)
        run: flutter test --coverage --exclude-tags golden

      - name: Enforce coverage threshold on core/ and domain/ layers
        run: |
          # Real numeric gate, not the old `test -f lcov.info` placeholder.
          # Threshold (55%) is set a few points below this branch's actual
          # measured core/+domain/ coverage (~58% as of feat/motion-polish)
          # — a real floor a future regression can trip, not a number
          # picked to always pass. `lib/core/**` and any `**/domain/**`
          # feature directory are in scope (matches this repo's Clean
          # Architecture split — see mobile/CLAUDE.md); `presentation/`/
          # `data/` aren't counted here since widget/golden coverage isn't
          # what this gate is measuring. No external `lcov` CLI dependency
          # — plain awk over the lcov.info format so this doesn't need an
          # extra apt-get step on the runner.
          test -f coverage/lcov.info || (echo "::error::coverage/lcov.info missing" && exit 1)
          awk '
            /^SF:/ {
              file = $0; sub(/^SF:/, "", file)
              in_scope = (file ~ /^lib\/core\// || file ~ /\/domain\//)
            }
            /^LF:/ { if (in_scope) { n = $0; sub(/^LF:/, "", n); lf += n } }
            /^LH:/ { if (in_scope) { n = $0; sub(/^LH:/, "", n); lh += n } }
            END {
              pct = (lf > 0) ? 100 * lh / lf : 0
              printf "core/+domain/ line coverage: %.2f%% (%d/%d lines)\n", pct, lh, lf
              if (pct < 55) {
                printf "::error::coverage %.2f%% is below the 55%% threshold\n", pct
                exit 1
              }
            }
          ' coverage/lcov.info

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: mobile/coverage/lcov.info

  golden:
    name: Golden / screenshot tests
    runs-on: ubuntu-latest
    needs: analyze
    # No CI env var needed — Alchemist doesn't gate on one; it always runs
    # both the `goldens/linux/*.png` (real render) and `goldens/ci/*.png`
    # scenarios as separate test cases, comparing against whatever's
    # committed for each. See mobile/CLAUDE.md's Golden testing section
    # for why `goldens/ci/*.png` shows real text here rather than
    # Alchemist's obscured-box default.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Run golden tests
        run: flutter test --tags golden

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: golden-failures
          path: mobile/test/goldens/failures/

  build-smoke:
    name: Debug build smoke test (Android)
    runs-on: ubuntu-latest
    needs: [test, golden]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (mock API, unobfuscated — smoke test only)
        run: flutter build apk --debug --dart-define=USE_MOCK_API=true
