<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelal Studio — Portal</title>
    <script>
      // Set the theme before first paint. Without this the page renders light
      // for a frame and then flips, because the React controller cannot run
      // until after the bundle has parsed. Kept inline and dependency-free for
      // that reason; ThemeContext.tsx owns the attribute from then on.
      (function () {
        try {
          var p = localStorage.getItem('kelal.theme');
          var dark =
            p === 'dark' ||
            ((p === null || p === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
